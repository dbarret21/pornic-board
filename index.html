<style>
  :root{

  }
  *{box-sizing:border-box;}
  body{margin:0;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;background:var(--bg);color:var(--text);padding:24px;}
  h1{font-size:22px;margin:0 0 4px;}
  .subtitle{color:var(--muted);font-size:13px;margin-bottom:18px;}
  .badges-row{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:24px;}
  .filter-badge{background:#eef2ff;color:#3730a3;border:1px solid #c7d2fe;padding:5px 12px;border-radius:999px;font-size:12.5px;font-weight:600;}
  .filter-badge.zone{background:#ecfdf5;color:#065f46;border-color:#a7f3d0;}
  .filter-badge.excl{background:#fef2f2;color:#991b1b;border-color:#fecaca;}
  h2.section{font-size:15px;text-transform:uppercase;letter-spacing:.04em;color:var(--muted);margin:28px 0 12px;display:flex;align-items:center;gap:8px;}
  .count-pill{background:var(--text);color:#fff;border-radius:999px;padding:2px 9px;font-size:12px;}
  .grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(320px,1fr));gap:16px;}
  .prop-card{background:var(--card);border:1px solid var(--border);border-radius:12px;padding:16px;transition:opacity .25s ease;position:relative;}
  .prop-card.top-pick{border:2px solid var(--accent);box-shadow:0 0 0 3px rgba(37,99,235,.08);}
  .prop-card.interested{border-left:4px solid var(--green);}
  .card-badges{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:8px;}
  .badge{font-size:11px;font-weight:700;padding:3px 8px;border-radius:6px;text-transform:uppercase;letter-spacing:.03em;}
  .badge.top_pick{background:#dbeafe;color:#1e40af;}
  .badge.character{background:#fce7f3;color:#9d174d;}
  .badge.price_drop{background:#dcfce7;color:#166534;}
  .badge.price_increase{background:#fee2e2;color:#991b1b;}
  .badge.stale_45d{background:#fef3c7;color:#92400e;}
  .badge.interested{background:#dcfce7;color:#166534;}
  .card-title{font-size:15px;font-weight:700;margin:0 0 4px;line-height:1.3;}
  .card-location{color:var(--muted);font-size:12.5px;margin-bottom:10px;}
  .card-stats{display:flex;flex-wrap:wrap;gap:10px 16px;font-size:13px;margin-bottom:10px;}
  .stat b{display:block;font-size:14.5px;}
  .stat span{color:var(--muted);font-size:11px;text-transform:uppercase;}
  .card-note{font-size:12.5px;color:#374151;background:#f9fafb;border-radius:8px;padding:8px 10px;margin-bottom:10px;max-height:110px;overflow-y:auto;line-height:1.4;}
  .card-agent{font-size:12px;color:var(--muted);margin-bottom:10px;}
  .card-link{display:inline-block;font-size:12.5px;color:var(--accent);text-decoration:none;font-weight:600;margin-bottom:10px;}
  .card-actions{display:flex;gap:8px;margin-top:8px;}
  .btn{flex:1;padding:8px 10px;border-radius:8px;border:1px solid var(--border);font-size:13px;font-weight:600;cursor:pointer;background:#fff;}
  .btn-up{color:var(--green);border-color:#bbf7d0;}
  .btn-up:hover{background:#f0fdf4;}
  .btn-down{color:var(--red);border-color:#fecaca;}
  .btn-down:hover{background:#fef2f2;}
  .btn-visit{color:var(--accent);border-color:#bfdbfe;width:100%;}
  .reason-panel{display:none;margin-top:10px;border-top:1px solid var(--border);padding-top:10px;}
  .reason-panel.open{display:block;}
  .reason-opt{display:flex;align-items:center;gap:6px;font-size:12.5px;margin-bottom:6px;}
  .reason-other-text{width:100%;padding:6px 8px;border:1px solid var(--border);border-radius:6px;font-size:12.5px;margin-top:4px;}
  .btn-confirm{margin-top:8px;width:100%;background:var(--red);color:#fff;border:none;padding:8px;border-radius:8px;font-weight:700;cursor:pointer;font-size:13px;}
  details.archived{margin-top:28px;}
  summary{cursor:pointer;font-weight:700;color:var(--muted);font-size:14px;padding:8px 0;}
  .archived-list{display:flex;flex-direction:column;gap:6px;margin-top:10px;}
  .archived-row{display:flex;justify-content:space-between;gap:12px;font-size:12.5px;color:#9ca3af;background:#fafafa;border:1px solid var(--border);border-radius:8px;padding:8px 12px;}
  .archived-row .a-name{color:#6b7280;font-weight:600;}
  .archived-row .a-reason{font-style:italic;}
  .empty{color:var(--muted);font-size:13px;padding:12px 0;}
</style>

function esc(s){
  if(s===null||s===undefined) return '';
  return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
}
function fmtEUR(n){ if(n===null||n===undefined) return '—'; return n.toLocaleString('fr-FR')+' €'; }
function fmtM2(n){ if(n===null||n===undefined) return '—'; return n+' m²'; }

  {cls:'filter-badge zone', text:'La Bernerie-en-Retz'},

];
document.getElementById('filterBadges').innerHTML = badges.map(b=>`<span class="${b.cls}">${esc(b.text)}</span>`).join('');

const REASONS = f.rejection_reasons_taxonomy;

function cardStats(p){
  const stats = [];
  if(p.price!==undefined) stats.push({label:'Prix', val: fmtEUR(p.price)});
  if(p.surface!==undefined) stats.push({label:'Surface', val: fmtM2(p.surface)});
  if(p.rooms!==undefined) stats.push({label:'Pièces', val: p.rooms});
  if(p.land!==undefined && p.land!==null) stats.push({label:'Terrain', val: fmtM2(p.land)});
  else if(p.terrain_sqm!==undefined) stats.push({label:'Terrain', val: fmtM2(p.terrain_sqm)});
  if(p.built) stats.push({label:'Construction', val: p.built});
  else if(p.build_year) stats.push({label:'Construction', val: p.build_year});
  return stats;
}

function renderActiveCard(p, idx){
  const badgeList = (p.badges||[]).slice();
  if(p.top_pick) badgeList.unshift('top_pick');
  const badgeHtml = badgeList.map(b=>`<span class="badge ${esc(b)}">${esc(b.replace(/_/g,' '))}</span>`).join('');
  const stats = cardStats(p);
  const statsHtml = stats.map(s=>`<div class="stat"><b>${esc(s.val)}</b><span>${esc(s.label)}</span></div>`).join('');
  const reasonOpts = REASONS.map((r,ri)=>`<label class="reason-opt"><input type="checkbox" class="reason-cb" data-card="${idx}" data-label="${esc(r.label)}"> ${esc(r.label)}</label>`).join('');
  return `
  <div class="prop-card ${p.top_pick?'top-pick':''}" id="active-card-${idx}" data-idx="${idx}">
    ${badgeHtml?`<div class="card-badges">${badgeHtml}</div>`:''}
    <div class="card-title">${esc(p.name)}</div>
    <div class="card-location">${esc(p.location||p.zone||'')}</div>
    <div class="card-stats">${statsHtml}</div>
    ${p.agent?`<div class="card-agent">Agent : ${esc(p.agent)}</div>`:''}
    ${p.agent_note?`<div class="card-note">${esc(p.agent_note)}</div>`:''}
    ${p.url?`<a class="card-link" href="${esc(p.url)}" target="_blank" rel="noopener">Voir l'annonce ↗</a>`:''}
    <div class="card-actions">
      <button class="btn btn-up" data-idx="${idx}">👍 Intéressant</button>
      <button class="btn btn-down" data-idx="${idx}">👎 Pas pour moi</button>
    </div>
    <div class="reason-panel" id="reason-panel-${idx}">
      ${reasonOpts}
      <label class="reason-opt"><input type="checkbox" class="reason-cb-other" data-card="${idx}"> Autre :</label>
      <input type="text" class="reason-other-text" id="other-text-${idx}" placeholder="Précisez...">
      <button class="btn-confirm" data-idx="${idx}">Confirmer le rejet</button>
    </div>
  </div>`;
}

function renderUpCard(p, idx){
  const stats = cardStats(p);
  const statsHtml = stats.map(s=>`<div class="stat"><b>${esc(s.val)}</b><span>${esc(s.label)}</span></div>`).join('');
  return `
  <div class="prop-card interested" data-idx="${idx}">
    <div class="card-badges"><span class="badge interested">Interested</span></div>
    <div class="card-title">${esc(p.name)}</div>
    <div class="card-location">${esc(p.location||p.zone||'')}</div>
    <div class="card-stats">${statsHtml}</div>
    ${p.agent?`<div class="card-agent">Agent : ${esc(p.agent)}</div>`:''}
    ${p.agent_note?`<div class="card-note">${esc(p.agent_note)}</div>`:''}
    ${p.url?`<a class="card-link" href="${esc(p.url)}" target="_blank" rel="noopener">Voir l'annonce ↗</a>`:''}
    <button class="btn btn-visit" data-visit="${esc(p.name)}">Prepare visit brief ↗</button>
  </div>`;
}

function renderArchivedRow(p){
  let reason = p.archive_reason || p.excluded_reason || '';
  if(p.archive_note) reason += (reason?' — ':'') + p.archive_note.slice(0,140);
  const date = p.archived_date || p.archive_date || '';
  return `<div class="archived-row"><span class="a-name">${esc(p.name)}</span><span class="a-reason">${esc(reason)} ${esc(date)}</span></div>`;
}

  btn.addEventListener('click', ()=>{
    const idx = btn.getAttribute('data-idx');
    const p = DATA.active[idx];
    const checked = Array.from(document.querySelectorAll('.reason-cb[data-card="'+idx+'"]:checked')).map(cb=>cb.getAttribute('data-label'));
    const otherChecked = document.querySelector('.reason-cb-other[data-card="'+idx+'"]').checked;
    const otherText = document.getElementById('other-text-'+idx).value.trim();
    if(otherChecked && otherText) checked.push('Other');
    const msg = '👎 ' + p.name + ' — rejected. Reasons: ' + checked.join(', ') + '. Note: ' + (otherText || '(none)') + '.';
    copyAndAlert(msg, idx);
  });
});

function copyAndAlert(msg, cardIdx){
  const doAfter = () => {
    alert("Copié. Collez ceci dans votre chat Pornic dans Claude (ouvrez le projet Pornic si vous n'en avez pas un ouvert) pour que ce soit enregistré — cette page ne peut pas l'enregistrer elle-même.");
    if(cardIdx!==undefined){
      const card = document.getElementById('active-card-'+cardIdx);
      if(card){
        card.style.opacity='0';
        setTimeout(()=>{ card.remove(); updateActiveCount(); }, 250);
      }
    }
  };
  if(navigator.clipboard && navigator.clipboard.writeText){
    navigator.clipboard.writeText(msg).then(doAfter).catch(doAfter);
  } else {
    const ta = document.createElement('textarea');
    ta.value = msg; document.body.appendChild(ta); ta.select();
    try{ document.execCommand('copy'); }catch(e){}
    document.body.removeChild(ta);
    doAfter();
  }
}
</script>
