function esc(s){
  if (s===null || s===undefined) return '';
  return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
}
function fmtPrice(p){ return p ? p.toLocaleString('fr-FR') + ' EUR' : '-'; }
function fmtPm2(p, s){ return (p && s) ? Math.round(p/s).toLocaleString('fr-FR') + ' EUR/m2' : ''; }

const badgeLabels = {
  top_pick: 'Top pick', character: 'Caractere', price_drop: 'Baisse de prix',
  stale_45d: '45+ jours', re_added: 'Re-ajoute'
};

function dpeClass(d){
  if (!d) return '';
  if (['A','B','C'].includes(d)) return 'success';
  if (['D','E'].includes(d)) return 'warn';
  return 'danger';
}

function propCard(p, idx, kind){
  const badges = (p.badges||[]).map(b => `<span class="pbadge">${esc(badgeLabels[b]||b)}</span>`).join('');
  const topClass = p.top_pick ? ' top' : (kind==='thumbsup' ? ' thumbsup' : '');
  const topPickTag = p.top_pick ? `<span class="pbadge accent">Top pick</span>` : '';
  const dpeTag = p.dpe ? `<span class="pbadge ${dpeClass(p.dpe)}">DPE ${esc(p.dpe)}</span>` : `<span class="pbadge">DPE non confirme</span>`;
  const landTxt = p.land ? `${p.land} m2 terrain` : '';
  const bedTxt = p.bedrooms ? `${p.bedrooms} ch.` : '';
  const roomTxt = p.rooms ? `${p.rooms} p.` : '';
  const meta = [roomTxt, bedTxt, `${p.surface} m2`, landTxt].filter(Boolean).join(' | ');

  let actionsHtml = '';
  if (kind === 'active') {
    actionsHtml = `
      <div class="actions">
        <button class="btn-up" data-idx="${idx}">Interessant</button>
        <button class="btn-down" data-idx="${idx}">Pas pour moi</button>
      </div>
      <div class="reason-panel" data-idx="${idx}">
        ${DATA.taxonomy.map(t => `
          <label>
            <input type="checkbox" class="reason-check" data-idx="${idx}" data-label="${esc(t.label)}" />
            ${esc(t.label)}
          </label>`).join('')}
        <input type="text" class="reason-other" data-idx="${idx}" placeholder="Autre (optionnel)" />
        <button class="btn-confirm" data-idx="${idx}">Confirmer le rejet</button>
      </div>`;
  } else if (kind === 'thumbsup') {
    actionsHtml = `<div class="actions"><button class="btn-brief" data-idx="${idx}">Preparer la visit brief</button></div>`;
  }

  return `
  <div class="card${topClass}" id="${kind}-card-${idx}">
    <div>${topPickTag}${dpeTag}${badges}${kind==='thumbsup' ? '<span class="pbadge success">Interesse</span>' : ''}</div>
    <p class="name">${esc(p.name)}</p>
    <p class="loc">${esc(p.location)}</p>
    <p class="price">${fmtPrice(p.price)}</p>
    <p class="meta">${fmtPm2(p.price,p.surface)} | ${esc(meta)}</p>
    <p class="agent">${esc(p.agent||'')}</p>
    <p class="note">${esc(p.agent_note||'')}</p>
    <a class="link" href="${esc(p.url)}" target="_blank" rel="noopener">Voir l'annonce &#8599;</a>
    ${actionsHtml}
  </div>`;
}

function copyFallback(text){
  navigator.clipboard.writeText(text).then(() => {
    alert("Copie. Collez ce message dans votre chat Pornic sur Claude (ouvrez le projet Pornic si aucun chat n'est ouvert) pour que ce soit enregistre — cette page ne peut pas l'enregistrer elle-meme.");
  }).catch(() => {
    prompt("Copiez ce message et collez-le dans votre chat Pornic sur Claude :", text);
  });
}

function render(){
  document.getElementById('active-grid').innerHTML = DATA.active.map((p,i)=>propCard(p,i,'active')).join('');
  document.getElementById('thumbsup-grid').innerHTML = DATA.thumbs_up.map((p,i)=>propCard(p,i,'thumbsup')).join('');
  document.getElementById('active-count').textContent = DATA.active.length;
  document.getElementById('archived-count').textContent = DATA.archived.length;

  document.getElementById('archived-list').innerHTML = DATA.archived.map(a => `
    <div class="arch-row">
      <span>${esc(a.name)}</span>
      <span class="arch-meta">${esc(a.reason)} ${esc(a.date)}</span>
    </div>`).join('');

  attachHandlers();
}

function attachHandlers(){
  document.querySelectorAll('.btn-up').forEach(btn => {
    btn.addEventListener('click', () => {
      const idx = parseInt(btn.getAttribute('data-idx'));
      const p = DATA.active[idx];
      copyFallback(`\ud83d\udc4d ${p.name} \u2014 I like this one. Please dig deeper and prepare a full visit brief.`);
    });
  });
  document.querySelectorAll('.btn-down').forEach(btn => {
    btn.addEventListener('click', () => {
      const idx = btn.getAttribute('data-idx');
      const panel = document.querySelector(`.reason-panel[data-idx="${idx}"]`);
      if (panel) panel.style.display = panel.style.display === 'none' || !panel.style.display ? 'block' : 'none';
    });
  });
  document.querySelectorAll('.btn-confirm').forEach(btn => {
    btn.addEventListener('click', () => {
      const idx = parseInt(btn.getAttribute('data-idx'));
      const p = DATA.active[idx];
      const checks = document.querySelectorAll(`.reason-check[data-idx="${idx}"]:checked`);
      const labels = Array.from(checks).map(c => c.getAttribute('data-label'));
      const otherInput = document.querySelector(`.reason-other[data-idx="${idx}"]`);
      const otherText = otherInput ? otherInput.value.trim() : '';
      const reasonsTxt = labels.length ? labels.join(', ') : 'Non precise';
      const noteTxt = otherText || '(aucune)';
      copyFallback(`\ud83d\udc4e ${p.name} \u2014 rejected. Reasons: ${reasonsTxt}. Note: ${noteTxt}.`);
      const card = document.getElementById(`active-card-${idx}`);
      if (card){
        card.style.transition = 'opacity 0.25s ease';
        card.style.opacity = '0';
        setTimeout(() => {
          card.remove();
          const remaining = document.querySelectorAll('.card[id^="active-card-"]').length;
          document.getElementById('active-count').textContent = remaining;
        }, 250);
      }
    });
  });
  document.querySelectorAll('.btn-brief').forEach(btn => {
    btn.addEventListener('click', () => {
      const idx = parseInt(btn.getAttribute('data-idx'));
      const p = DATA.thumbs_up[idx];
      copyFallback(`Please prepare a full visit brief for ${p.name}.`);
    });
  });
  document.getElementById('archived-toggle').addEventListener('click', () => {
    const el = document.getElementById('archived-list');
    el.style.display = el.style.display === 'none' || !el.style.display ? 'block' : 'none';
  });
}

render();
</script>
